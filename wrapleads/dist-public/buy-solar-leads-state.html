<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commercial Solar Leads — by state | HelioScout</title>
<meta name="description" content="EPA-verified commercial solar leads, NAICS-scored. Pick your state, see top sectors + sample.">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; margin: 0; background: #0a0b0d; color: #f4f5f7; line-height: 1.55; }
  .page { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
  .nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 28px; }
  .brand { font-weight: 800; font-size: 18px; }
  .brand span { color: #f59e0b; }
  .back { font-size: 12px; color: #94a3b8; text-decoration: none; }
  .back:hover { color: #f4f5f7; }

  h1 { font-size: 46px; font-weight: 800; letter-spacing: -0.02em; margin: 20px 0 12px; line-height: 1.05; }
  h1 .accent { color: #f59e0b; }
  .lede { font-size: 17px; color: #cbd5e1; max-width: 720px; margin-bottom: 32px; }

  .state-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 24px 0 48px; }
  .state-tile {
    padding: 14px 8px; background: rgba(255,255,255,0.04); border: 1px solid #2a2e36;
    border-radius: 8px; text-align: center; text-decoration: none; color: #f4f5f7;
    transition: all 0.15s; cursor: pointer;
  }
  .state-tile:hover { background: rgba(245,158,11,0.1); border-color: #f59e0b; transform: translateY(-1px); }
  .state-tile.hot { background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(245,158,11,0.05)); border-color: rgba(245,158,11,0.5); }
  .state-tile .code { font-weight: 800; font-size: 18px; letter-spacing: 0.04em; }
  .state-tile .n { font-size: 11px; color: #f59e0b; margin-top: 2px; font-weight: 700; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
  .stat { padding: 20px; background: rgba(255,255,255,0.04); border: 1px solid #2a2e36; border-radius: 10px; }
  .stat .v { font-size: 28px; font-weight: 800; color: #f59e0b; line-height: 1; }
  .stat .l { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #94a3b8; margin-top: 8px; }

  .preview-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin: 24px 0; }
  .panel { padding: 24px; background: #14161a; border: 1px solid #2a2e36; border-radius: 12px; }
  .panel h3 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2e36; }
  th { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
  td.num { text-align: right; font-weight: 700; color: #f59e0b; font-variant-numeric: tabular-nums; }

  .cta { display: flex; gap: 12px; justify-content: center; margin: 40px 0 24px; }
  .btn { display: inline-block; padding: 14px 28px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
  .btn.alt { background: rgba(255,255,255,0.06); color: #f4f5f7; border: 1px solid #2a2e36; }
  .btn:hover { background: #fbbf24; }

  .loading { padding: 80px; text-align: center; color: #94a3b8; font-size: 14px; }
  .empty { padding: 60px; text-align: center; color: #94a3b8; font-size: 14px; border: 1px dashed #2a2e36; border-radius: 12px; }

  @media (max-width: 720px) {
    h1 { font-size: 32px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .preview-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="page">

  <nav class="nav">
    <div class="brand">HelioScout<span>.</span></div>
    <a class="back" href="/buy-solar-leads">← All packs</a>
  </nav>

  <div id="content">
    <div class="loading">Loading state data…</div>
  </div>

  <div style="margin-top: 60px; text-align: center; font-size: 12px; color: #5e6470;">
    <a href="/buy-solar-leads" style="color: #f59e0b;">All packs</a> ·
    <a href="/commercial-solar-roi-calculator" style="color: #f59e0b;">ROI calculator</a> ·
    <a href="mailto:hello@helioscout.io" style="color: #f59e0b;">hello@helioscout.io</a>
  </div>
</div>

<script>
  // Pull state from URL path (?state=TX or /buy-solar-leads/tx) or default chooser
  const path = window.location.pathname;
  const queryState = (new URLSearchParams(window.location.search)).get('state');
  const pathMatch = path.match(/\/buy-solar-leads\/([a-z]{2})/i);
  const state = (queryState || pathMatch?.[1] || '').toUpperCase();

  const HOT_STATES_BASELINE = [
    ['TX', 3009], ['CA', 1594], ['OH', 992], ['PA', 866], ['IL', 644],
    ['FL', 583], ['GA', 550], ['NY', 527], ['AZ', 475], ['NJ', 450],
  ];
  const ALL_STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

  function fmt(n) { return Number(n || 0).toLocaleString(); }
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function renderChooser() {
    const tiles = ALL_STATES.map(st => {
      const hot = HOT_STATES_BASELINE.find(([s]) => s === st);
      const n = hot?.[1];
      return `<a class="state-tile${hot ? ' hot' : ''}" href="?state=${st}">
        <div class="code">${st}</div>
        ${n ? `<div class="n">${fmt(n)} leads</div>` : ''}
      </a>`;
    }).join('');

    document.getElementById('content').innerHTML = `
      <h1>Commercial solar leads <span class="accent">by state</span></h1>
      <p class="lede">
        Pick a state to preview the lead pack — top NAICS sectors, sample of the highest-fit accounts,
        average fit score. Hot states (10 highest-volume) are highlighted in amber.
      </p>
      <div class="state-grid">${tiles}</div>
      <div class="cta">
        <a class="btn" href="/buy-solar-leads#sample">Get 50 free leads</a>
        <a class="btn alt" href="/buy-solar-leads">See pricing</a>
      </div>
    `;
  }

  async function renderState(st) {
    document.getElementById('content').innerHTML = '<div class="loading">Loading ' + st + ' data…</div>';
    try {
      const r = await fetch('/solar/store/state-stats/' + st);
      const data = await r.json();
      if (!data.count) {
        document.getElementById('content').innerHTML = `
          <h1>No pack yet for <span class="accent">${st}</span></h1>
          <p class="lede">
            We haven't packaged ${st} yet, but the national pack ($4,997) covers it.
            Reply to <a href="mailto:hello@helioscout.io?subject=${st}%20pack%20request" style="color: #f59e0b;">hello@helioscout.io</a>
            and we'll generate a custom ${st} pack within 48 hours.
          </p>
          <div class="cta">
            <a class="btn" href="/buy-solar-leads#pricing">See pricing</a>
            <a class="btn alt" href="/buy-solar-leads/index.html">← Back to states</a>
          </div>`;
        return;
      }
      const sectorsRows = (data.top_sectors || []).map(s => `
        <tr>
          <td>${esc(s.sector)}</td>
          <td class="num">${fmt(s.n)}</td>
        </tr>`).join('');
      const sampleRows = (data.sample || []).map(s => `
        <tr>
          <td>${esc(s.company)}</td>
          <td>${esc(s.city)}</td>
          <td class="num">${esc(s.fit)}</td>
        </tr>`).join('') || '<tr><td colspan="3" style="color:#94a3b8;text-align:center;padding:20px;">Sample loading…</td></tr>';

      document.getElementById('content').innerHTML = `
        <h1>${st} commercial solar leads<br><span class="accent">${fmt(data.count)} verified facilities</span></h1>
        <p class="lede">
          ${st} has <strong>${fmt(data.count)}</strong> commercial solar leads in HelioScout's database
          — EPA GHGRP facilities, USAspending federal awardees, and OpenStreetMap industrial polygons.
          Average solar-fit score: <strong style="color:#f59e0b;">${data.avg_fit_score}/100</strong>.
        </p>

        <div class="stats">
          <div class="stat"><div class="v">${fmt(data.count)}</div><div class="l">Total ${st} leads</div></div>
          <div class="stat"><div class="v">${data.avg_fit_score}</div><div class="l">Avg fit score</div></div>
          <div class="stat"><div class="v">$1,497</div><div class="l">State pack price</div></div>
          <div class="stat"><div class="v">99%</div><div class="l">EPA-verified</div></div>
        </div>

        <div class="preview-grid">
          <div class="panel">
            <h3>Top sectors in ${st}</h3>
            <table>
              <thead><tr><th>NAICS sector</th><th class="num">Lead count</th></tr></thead>
              <tbody>${sectorsRows}</tbody>
            </table>
          </div>
          <div class="panel">
            <h3>Sample (top fit)</h3>
            <table>
              <thead><tr><th>Company</th><th>City</th><th class="num">Fit</th></tr></thead>
              <tbody>${sampleRows}</tbody>
            </table>
          </div>
        </div>

        <div class="cta">
          <a class="btn" href="/buy-solar-leads#sample">Get 50 free samples first</a>
          <a class="btn" style="background:#22c55e;" href="mailto:hello@helioscout.io?subject=${st}%20state%20pack&body=I%20want%20to%20buy%20the%20${st}%20state%20pack%20(%24%201%2C497).">Buy ${st} pack — $1,497</a>
        </div>

        <div style="margin-top:32px; padding: 24px; background: rgba(245,158,11,0.06); border-left: 3px solid #f59e0b; border-radius: 8px;">
          <strong>What's in every ${st} lead:</strong>
          Company + city + NAICS + solar fit score (0-100) + estimated system kW + year-1 kWh production
          + year-1 dollar savings @ ${st === 'CA' ? '$0.27' : st === 'HI' ? '$0.40' : '$0.10-0.17'}/kWh commercial rate
          + net payback after ITC + state stack + 25-yr NPV + industry-specific cold-open sales script.
          One CSV file. No subscription.
        </div>
      `;
    } catch (e) {
      document.getElementById('content').innerHTML = `
        <h1>Could not load ${st}</h1>
        <p class="lede">Try refreshing or email <a href="mailto:hello@helioscout.io" style="color: #f59e0b;">hello@helioscout.io</a>.</p>`;
    }
  }

  if (state && /^[A-Z]{2}$/.test(state)) renderState(state);
  else renderChooser();
</script>
</body>
</html>
