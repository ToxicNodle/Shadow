name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: wrapleads/package-lock.json

    - name: Install server dependencies
      working-directory: wrapleads
      run: npm install

    - name: Build frontend (Vite)
      working-directory: wrapleads
      run: npm run build

    - name: Verify dist output
      working-directory: wrapleads
      run: |
        test -f dist/index.html || (echo "dist/index.html missing — build failed" && exit 1)
        echo "Build OK — $(du -sh dist | cut -f1) written to dist/"
